<style>
:root{--bg:#EEF2F6;--card:#fff;--tx:#0C1A2B;--mut:#5B6B7F;--bd:#DCE3EB;--ac:#1F46E0;--onac:#fff;--hero:#0C1A2B;--sun:#FFC21F;--ok:#0A8F67;--err:#D6343A;--r1:28px;--r2:18px;--dp:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;--bd2:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080F1B;--card:#101B2D;--tx:#EAF0FA;--mut:#93A4BB;--bd:#1E2D45;--ac:#7C97FF;--onac:#0B1626;--hero:#14274A;--ok:#34D3A0;--err:#FF6B70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080F1B;--card:#101B2D;--tx:#EAF0FA;--mut:#93A4BB;--bd:#1E2D45;--ac:#7C97FF;--onac:#0B1626;--hero:#14274A;--ok:#34D3A0;--err:#FF6B70;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--bd2);-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:18px 16px 112px}
h1{font:800 36px/1 var(--dp);letter-spacing:-.01em;margin:6px 0 16px}
h1.brand{font-size:52px;margin-bottom:4px}
h2{font:700 24px/1.1 var(--dp);margin:24px 0 10px}
p{line-height:1.5}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:16px;margin-bottom:12px}
.m{color:var(--mut);font-size:14px}
label{display:block;font:600 14px/1.2 var(--bd2);color:var(--mut);margin:16px 0 6px}
input,select,textarea{width:100%;font:500 16px var(--bd2);color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
input[type=checkbox]{width:auto;min-height:0}
button{font:600 16px/1 var(--bd2);border:0;border-radius:999px;padding:14px 22px;min-height:48px;background:var(--ac);color:var(--onac);cursor:pointer;transition:opacity .15s,transform .1s}
button:active{opacity:.8;transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd);font-weight:500}
button.g[data-a="sel"],button.g[data-a="rsel"]{border-radius:var(--r2);padding:14px 16px;line-height:1.35}
.full{width:100%;margin-top:14px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
details{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);margin-bottom:10px;padding:2px 16px}
summary{padding:14px 0;font:700 21px/1.1 var(--dp);cursor:pointer;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;margin-left:auto}
details[open] summary::after{transform:rotate(-135deg)}
summary span{font:500 14px var(--bd2);color:var(--mut);margin-left:8px}
.s{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--bd)}
.s .sb{flex:1;font-size:15px;min-width:0}.s .sb b{font:700 19px/1.1 var(--dp)}
.s button{padding:10px 16px;font-size:15px;min-height:42px}
.s.today{box-shadow:inset 4px 0 0 var(--sun);padding-left:14px}.s.miss{opacity:.62}
.tag{font:600 12px/1 var(--bd2);padding:5px 9px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent);color:var(--mut);white-space:nowrap}
.ok{color:var(--ok);font-weight:600;font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font:700 34px/1 var(--dp)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--bd);font-size:15px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border:0;border-radius:var(--r1);padding:22px 20px 20px}
.hero>*{position:relative;z-index:1}
.hero svg.trk{position:absolute;right:-70px;top:-34px;width:310px;height:auto;z-index:0}
.hero .m{color:rgba(255,255,255,.78)}
.when{font:700 15px var(--bd2);color:var(--sun)}
.hl{font:800 48px/.95 var(--dp);margin-top:6px;letter-spacing:-.01em}
.hd{font:600 16px var(--bd2);opacity:.85;margin-top:6px}
.hx{margin-top:12px;max-width:80%}
.chip{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:999px;background:var(--sun);color:#0C1A2B;font:700 14px var(--bd2)}
.hero button{background:var(--sun);color:#0C1A2B;font-size:17px;min-height:54px}
.board{background:var(--hero);color:#fff;border:0;border-radius:var(--r1);text-align:center;padding:20px}
.board .m{color:rgba(255,255,255,.7)}
.big{font:800 92px/1 var(--dp);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dchip{position:relative;display:flex;align-items:center;justify-content:center;margin:0;padding:11px 15px;min-width:54px;border:1.5px solid var(--bd);border-radius:999px;font:600 15px var(--bd2);color:var(--tx);background:var(--card);cursor:pointer}
.dchip input{position:absolute;inset:0;width:100%!important;height:100%;margin:0;opacity:0;cursor:pointer}
.dchip:has(input:checked){background:var(--ac);border-color:var(--ac);color:var(--onac)}
.dchip:has(input:disabled){opacity:.4}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:6px;z-index:20;box-shadow:0 6px 20px rgba(12,26,43,.1)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;color:var(--mut);border-radius:22px;padding:9px 2px 8px;min-height:56px;font:600 11px/1 var(--bd2)}
nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}
nav svg{width:22px;height:22px}
svg{width:100%;height:auto;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:24px;font:600 14px var(--bd2);z-index:50;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}#toast.on{opacity:1}
.rs{display:none}
.pic{display:block;width:100%;height:auto;color:var(--tx)}
.c details{background:transparent;border:0;border-top:1px solid var(--bd);border-radius:0;margin:0;padding:0}.c details:first-of-type{border-top:0}
.c details summary{font:600 17px var(--bd2);padding:14px 0}
.exb{padding:0 0 16px}.exb ol{margin:10px 0 8px;padding-left:20px;font-size:15px}.exb li{margin:5px 0}
@media(prefers-reduced-motion:reduce){.rn{display:none}.rs{display:inline}}
</style></head><body>
<main id="v"></main><div id="toast" role="status" aria-live="polite"></div>
<nav><button data-t="plan" aria-label="Plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>Plan</span></button><button data-t="run" aria-label="Course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg><span>Course</span></button><button data-t="renfo" aria-label="Renfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Renfo</span></button><button data-t="log" aria-label="Saisie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M12 8v8M8 12h8"/></svg><span>Saisie</span></button><button data-t="stats" aria-label="Stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Stats</span></button></nav>
<script>
var $=function(s){return document.querySelector(s)};
var S={p:null,plan:[],logs:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("foulee")||"{}"))}catch(e){}
function save(){try{S.refH=S.refH||[];var lr=S.refH[S.refH.length-1];if(S.ref&&(!lr||lr.r!=S.ref)){if(lr&&lr.d==today)lr.r=S.ref;else S.refH.push({d:today,r:S.ref});S.refH=S.refH.slice(-60)}var k="fouleeBk",prev=localStorage.getItem("foulee");if(prev){var a=JSON.parse(localStorage.getItem(k)||"[]");if(!a.some(function(x){return x.d==today})){var n=0;try{n=(JSON.parse(prev).logs||[]).length}catch(e){}a.push({d:today,n:n,j:prev});a=a.slice(-7);while(a.length>1&&JSON.stringify(a).length>3e6)a.shift();localStorage.setItem(k,JSON.stringify(a))}}localStorage.setItem("foulee",JSON.stringify(S))}catch(e){}}
var iso=function(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var dt=function(s){return new Date(s+"T12:00")};
var addD=function(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
var mon=function(s){return addD(s,-((dt(s).getDay()+6)%7))};
var fmtD=function(s){return dt(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})};
var today=iso(new Date());
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function pace(km,min){if(!(km>0&&min>0))return"–";var s=Math.round(min/km*60);return Math.floor(s/60)+"’"+String(s%60).padStart(2,"0")+"/km"}
function hm(m){m=Math.round(m);return m>=60?Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"):m+" min"}
var TY={easy:["Footing","#0A8F67"],quality:["Qualité","#E5484D"],recup:["Récup","#2E9BD6"],long:["Sortie longue","#7B4DFF"],renfo:["Renfo","#E58A00"],race:["Course","#E5484D"]};
var V={tab:"plan",draft:null,del:null};

function gen(p){
 var W=p.raceDate&&p.W?p.W:{poids:12,forme:8,"5k":8,"10k":10,semi:12}[p.goal],deb=p.level=="deb";
 var peak={poids:[50,70],forme:[35,45],"5k":[40,50],"10k":[60,70],semi:[95,105]}[p.goal][deb?0:1],st=deb?20:35;
 var cfg=dayCfg(p),types=cfg?cfg.types:p.goal=="poids"&&p.n>2?["easy","recup","long"]:p.n==2?["easy","long"]:p.n==3?["easy","quality","long"]:["easy","quality","recup","long"];
 var offs=cfg?cfg.offs:p.goal=="poids"&&p.n>2?[1,3,6]:p.n==2?[2,6]:p.n==3?[1,3,6]:[1,3,5,6];
 var out=[],r5=function(x){return Math.max(15,Math.round(x/5)*5)};
 for(var w=1;w<=W;w++){
  var L=st+(peak-st)*(w-1)/Math.max(1,W-2);
  if(w==W)L=peak*0.7;else if(p.raceDate&&w==W-1&&W>=6)L*=0.85;else if(w%4==0)L*=0.8;
  L=r5(L);var E=r5(L*0.6),early=deb&&w<=Math.ceil(W/2);
  var rs=[1,2,3,5,8,10,12,15][Math.min(w-1,7)],wk=rs<=2?2:1;
  var rw=function(t){return Math.max(3,Math.round(t/(rs+wk)))+" × ("+rs+" min course + "+wk+" min marche)"};
  types.forEach(function(ty,i){
   var d,m;
   if(ty=="easy"){m=E;d=early?"Course/marche : "+rw(E):"Footing "+E+" min, allure facile (tu peux parler)"}
   else if(ty=="long"){m=L;d=early?"Course/marche : "+rw(L):"Sortie longue "+L+" min, allure très confortable"}
   else if(ty=="recup"){m=early?30:25;d=early?"Marche active 30 min, allure soutenue":"Footing 25 min très lent, jambes légères"}
   else{
    if(early){m=30;d="Footing 25 min + 4 accélérations de 20 s, récup en marchant"}
    else{var dur=p.goal=="semi"?4:p.goal=="10k"?3:2,reps=Math.min(4+Math.floor(w/2),p.goal=="semi"?6:10);
     m=15+10+reps*(dur+(dur>2?2:1));d="15 min échauffement + "+reps+" × "+dur+" min soutenu / "+(dur>2?2:1)+" min trot + 10 min calme"}}
   out.push({id:"s"+w+"_"+i,w:w,date:addD(p.start,(w-1)*7+offs[i]),ty:ty,d:d,min:m,lid:null});
  });
 }
 if(p.goal=="poids"||p.renfo){for(var w=1;w<=W;w++)[["core","Gainage & ventre"],["legs","Jambes & fessiers"]].forEach(function(r,k){var rk=(cfg?cfg.rd:[0,4])[k];if(rk==null)return;out.push({id:"r"+w+"_"+k,w:w,date:addD(p.start,(w-1)*7+rk),ty:"renfo",rid:r[0],d:"Circuit « "+r[1]+" » · 2 tours, ~15 min",min:15,lid:null})})}
 if(p.raceDate){out=out.filter(function(s){return s.w<W||s.date<=addD(p.raceDate,-2)});out.forEach(function(s){if(s.w==W){if(s.ty=="quality"){s.d="Footing 20 min + 4 accélérations de 20 s (affûtage)";s.min=25}else if(s.ty=="long"){s.ty="easy";s.d="Footing 25 min facile, jambes légères";s.min=25}}});out.push({id:"race",w:W,date:p.raceDate,ty:"race",dist:p.raceDist,d:"Jour de course : "+{"5k":"5 km","10k":"10 km",semi:"semi-marathon"}[p.goal]+". Pars prudemment, finis fort.",min:Math.round(p.raceDist*6),lid:null})}
 out=out.filter(function(s){return!p.from||s.date>=p.from});out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});return out;
}
function nextMon(){var d=new Date(),k=(8-d.getDay())%7;if(d.getDay()==1)k=0;d.setDate(d.getDate()+k);return iso(d)}

function vPlan(){
 if(!S.p)return'<h1 class="brand">Foulée</h1><p class="m" style="margin:0 0 16px">Ton plan, tes allures, ta progression.</p><div class="c"><h2 style="margin-top:0">Crée ton plan</h2><p class="m">4 questions et ton plan est prêt. Ensuite, un test de 12 min te donnera tes allures cibles.</p>'+
 '<label>1 · Ton objectif</label><select id="g"><option value="poids">Perdre du poids (course + renfo)</option><option value="forme">Courir 30–40 min sans m’arrêter</option><option value="5k">Courir un 5 km</option><option value="10k">Courir un 10 km</option><option value="semi">Courir un semi-marathon</option></select>'+
 '<label>2 · Ton niveau</label><select id="lv"><option value="deb">Débutant (je démarre ou reprends)</option><option value="inter">Je cours déjà 30 min sans pause</option></select>'+
 '<label>3 · Tes jours de course (2 à 5)</label><div id="dy" style="display:flex;gap:8px;flex-wrap:wrap">'+DN.map(function(n,i){return'<label class="dchip"><input type="checkbox" value="'+i+'" style="width:auto"'+([1,3,6].indexOf(i)>=0?" checked":"")+'>'+n+'</label>'}).join("")+'</div><label>Jour de ta sortie longue (la plus longue de la semaine)</label><select id="ld">'+DN.map(function(n,i){return'<option value="'+i+'"'+(i==6?" selected":"")+'>'+n+'</option>'}).join("")+'</select><div id="dye" class="m" style="color:var(--err)"></div>'+
 '<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="rf" style="width:auto" checked> Ajouter 2 séances de renfo par semaine</label>'+'<label>4 · Début du plan</label><input type="date" id="sd" value="'+nextMon()+'">'+'<label>5 · Ta course (facultatif)</label><input type="date" id="rdte"><div class="m" style="margin-top:6px">Pour un 5 km, un 10 km ou un semi : le plan est calculé à rebours jusqu’à ce jour, avec une semaine d’affûtage.</div>'+
 '<button class="full" data-a="gen">Générer mon plan</button></div>';
 var W=S.p.W,k=Math.floor((dt(today)-dt(S.p.start))/864e5/7)+1,cw=Math.min(W,Math.max(1,k));
 var dn=S.plan.filter(function(s){return s.lid}).length,tot=S.plan.length;
 var nx=S.plan.filter(function(s){return !s.lid&&s.date>=today})[0],h='<h1>Mon plan</h1>'+adaptCard()+(nx?'<div class="c hero">'+TRACK+'<div class="when">'+(nx.date==today?"Aujourd’hui":nx.date==addD(today,1)?"Demain":"Prochaine séance")+'</div><div class="hl">'+TY[nx.ty][0]+'</div><div class="hd">'+fmtD(nx.date)+'</div><div class="m hx">'+nx.d+'</div>'+(tgtTxt(nx)?'<div class="chip">'+tgtTxt(nx)+'</div>':'')+'<button class="full" data-a="'+(nx.ty=="renfo"?"rgo":"go")+'" data-id="'+(nx.ty=="renfo"?nx.rid:nx.id)+'" data-sid="'+nx.id+'">'+(nx.ty=="renfo"?"Ouvrir le circuit":"▶ Lancer")+'</button></div>':'')+'<div class="c"><b>Semaine '+cw+' / '+W+'</b>'+raceLine()+'<div class="bar"><i style="width:'+Math.round(dn/tot*100)+'%"></i></div><div class="m">'+dn+' séances faites sur '+tot+' · '+{poids:"perte de poids",forme:"30–40 min en continu","5k":"5 km","10k":"10 km",semi:"semi-marathon"}[S.p.goal]+'</div>'+(S.p.goal=="poids"?'<p class="m">Pour perdre du poids, la régularité et l’alimentation comptent plus que l’intensité. Le ventre ne se cible pas : le renfo aide surtout à garder du muscle et à mieux courir.</p>':'')+'<button class="g" style="margin:10px 8px 0 0" data-a="pain">J’ai une douleur</button><button class="g" style="margin-top:10px" data-a="reset">Nouveau plan</button></div>'+vAllures();
 for(var w=1;w<=W;w++){
  var ss=S.plan.filter(function(s){return s.w==w}),d=ss.filter(function(s){return s.lid}).length,pm=ss.reduce(function(a,s){return a+s.min},0);
  h+='<details'+(w==cw?" open":"")+'><summary>Semaine '+w+(w%4==0&&w<W?" (allégée)":w==W?(S.p.raceDate?" (semaine de course)":" (affûtage)"):"")+' <span>· '+hm(pm)+' · '+d+'/'+ss.length+'</span></summary>';
  ss.forEach(function(s){
   var lg=s.lid&&S.logs.filter(function(l){return l.id==s.lid})[0];
   h+='<div class="s'+(s.date==today?" today":"")+(!s.lid&&s.date<today?" miss":"")+'"><div class="sb"><b>'+(s.date==today?"Aujourd’hui":fmtD(s.date))+'</b>'+(!s.lid&&s.date<today?' <span class="tag">manquée</span>':'')+(s.al&&!s.lid?' <span class="tag">allégée</span>':'')+' <span class="tag" style="color:'+TY[s.ty][1]+'">'+TY[s.ty][0]+'</span><div class="m">'+s.d+'</div>'+(tgtTxt(s)?'<div class="m" style="color:var(--ok)">'+tgtTxt(s)+'</div>':'')+'</div>'+
   (s.ty=="renfo"?(s.lid?'<span class="ok">✓ fait</span>':'<button data-a="rgo" data-id="'+s.rid+'" data-sid="'+s.id+'">Ouvrir</button>'):lg?'<span class="ok">✓ '+lg.km+' km</span>':'<span style="display:flex;gap:6px"><button data-a="go" data-id="'+s.id+'">▶</button><button class="g" data-a="rec" data-id="'+s.id+'">Noter</button></span>')+'</div>';
  });
  h+='</details>';
 }
 return h;
}
function vLog(){
 var d=V.draft||{};
 return'<h1>Enregistrer une séance</h1><div class="c">'+(d.pid?'<div class="m">Liée à une séance du plan ✓</div>':'')+
 '<label>Date</label><input type="date" id="dt" value="'+(d.date||today)+'">'+

 else if(a=="reset"){if(!V.rs){V.rs=1;b.textContent="Confirmer ? (tes séances restent enregistrées)";setTimeout(function(){V.rs=0;if(b.isConnected)b.textContent="Nouveau plan"},4000);return}V.rs=0;S.p=null;S.plan=[];save();render();toast("Plan supprimé")}
 else if(a=="rec"){var s=S.plan.filter(function(x){return x.id==b.dataset.id})[0];V.draft={date:s.date>today?today:s.date,pid:s.id,mn:s.min};show("log")}
 else if(a=="save"){var km=+String($("#km").value).replace(",","."),mn=parseDur($("#mn").value);
  if(!(km>0&&mn>0)){$("#err").textContent="Renseigne la distance et la durée.";return}
  var l={id:Date.now(),date:$("#dt").value||today,km:km,min:mn,rpe:+$("#rpe").value,notes:$("#nt").value.trim()};
  S.logs.push(l);
  if(V.draft&&V.draft.pid)S.plan.forEach(function(s){if(s.id==V.draft.pid)s.lid=l.id});
  V.draft=null;save();show("stats");toast("Séance enregistrée ✓")}
 else if(a=="rt"){var id2=+b.dataset.id;V.rt=V.rt==id2?null:id2;var y2=window.scrollY;render();window.scrollTo(0,y2)}
 else if(a=="wsave"){var kg=+$("#pk").value;if(kg>=30&&kg<=300){S.poids=(S.poids||[]).filter(function(x){return x.date!=today});S.poids.push({date:today,kg:Math.round(kg*10)/10});save();toast("Pesée ajoutée ✓");var y3=window.scrollY;render();window.scrollTo(0,y3)}}
 else if(a=="wdel"){var P2=(S.poids||[]).slice().sort(function(a,b){return a.date<b.date?-1:1});P2.pop();S.poids=P2;save();render()}
 else if(a=="bexp"){var t=$("#bk");t.value=JSON.stringify({p:S.p,plan:S.plan,logs:S.logs,renfo:S.renfo||[],poids:S.poids||[],ref:S.ref||0,refH:S.refH||[]});t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}$("#bm").textContent="Données copiées (sinon copie le texte à la main)."}
 else if(a=="bimp"){try{var o=JSON.parse($("#bk").value);if(!o||!Array.isArray(o.logs))throw 0;S.p=o.p||null;S.plan=o.plan||[];S.logs=o.logs;S.renfo=o.renfo||[];S.poids=o.poids||[];S.ref=o.ref||0;S.refH=o.refH||[];save();render();toast("Données importées ✓")}catch(e){$("#bm").textContent="Texte invalide : colle les données exportées."}}
 else if(a=="del"){var id=+b.dataset.id;
  if(V.del==id){S.logs=S.logs.filter(function(l){return l.id!=id});S.plan.forEach(function(s){if(s.lid==id)s.lid=null});V.del=null;save()}else V.del=id;
  var y=window.scrollY;render();window.scrollTo(0,y)}
});
